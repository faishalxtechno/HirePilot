<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HirePilot - Live AI Interview</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-bright": "#363941",
                        "surface-variant": "#32353c",
                        "inverse-primary": "#005ac2",
                        "background": "#10131a",
                        "surface-container-high": "#272a31",
                        "surface": "#10131a",
                        "primary": "#adc6ff",
                        "surface-container-lowest": "#0b0e15",
                        "on-primary-fixed": "#001a42",
                        "on-tertiary-fixed": "#311400",
                        "outline": "#8c909f",
                        "on-background": "#e1e2ec",
                        "surface-dim": "#10131a",
                        "secondary": "#4cd7f6",
                        "secondary-container": "#03b5d3",
                        "tertiary-fixed-dim": "#ffb786",
                        "on-primary-container": "#00285d",
                        "primary-fixed-dim": "#adc6ff",
                        "tertiary-fixed": "#ffdcc6",
                        "on-secondary-container": "#00424e",
                        "error-container": "#93000a",
                        "outline-variant": "#424754",
                        "error": "#ffb4ab",
                        "surface-tint": "#adc6ff",
                        "on-secondary-fixed-variant": "#004e5c",
                        "on-primary": "#002e6a",
                        "secondary-fixed-dim": "#4cd7f6",
                        "inverse-on-surface": "#2e3038",
                        "surface-container": "#1d2027",
                        "on-secondary": "#003640",
                        "inverse-surface": "#e1e2ec",
                        "on-tertiary-container": "#461f00",
                        "on-primary-fixed-variant": "#004395",
                        "surface-container-highest": "#32353c",
                        "on-tertiary-fixed-variant": "#723600",
                        "surface-container-low": "#191b23",
                        "primary-container": "#4d8eff",
                        "on-surface-variant": "#c2c6d6",
                        "on-error-container": "#ffdad6",
                        "tertiary": "#ffb786",
                        "on-error": "#690005",
                        "on-surface": "#e1e2ec",
                        "on-secondary-fixed": "#001f26",
                        "on-tertiary": "#502400",
                        "primary-fixed": "#d8e2ff",
                        "tertiary-container": "#df7412",
                        "secondary-fixed": "#acedff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-gap-sm": "8px",
                        "unit": "4px",
                        "stack-gap-lg": "24px",
                        "stack-gap-md": "16px",
                        "safe-area-bottom": "34px",
                        "container-padding": "20px"
                    },
                    "fontFamily": {
                        "label-caps": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "title-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "34px", "fontWeight": "600" }],
                        "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom Waveform Animation */
        @keyframes waveform {
            0% { transform: scaleY(0.4); opacity: 0.6; }
            50% { transform: scaleY(1); opacity: 1; }
            100% { transform: scaleY(0.4); opacity: 0.6; }
        }
        
        .bar-1 { animation: waveform 1.2s ease-in-out infinite 0.0s; }
        .bar-2 { animation: waveform 1.2s ease-in-out infinite 0.2s; }
        .bar-3 { animation: waveform 1.2s ease-in-out infinite 0.4s; }
        .bar-4 { animation: waveform 1.2s ease-in-out infinite 0.1s; }
        .bar-5 { animation: waveform 1.2s ease-in-out infinite 0.3s; }
        
        /* Disable scrollbar for immersive view */
        body::-webkit-scrollbar {
            display: none;
        }
        body {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col relative overflow-hidden font-sans antialiased">
<!-- Atmospheric Light Leaks -->
<div class="fixed top-[-20%] left-[-10%] w-[80%] h-[80%] bg-primary/10 blur-[120px] rounded-full z-[-1] pointer-events-none"></div>
<div class="fixed bottom-[-10%] right-[-20%] w-[60%] h-[60%] bg-secondary/10 blur-[100px] rounded-full z-[-1] pointer-events-none"></div>
<!-- 
        Navigation Shell Suppression Rule Applied: 
        This is a transactional/focused screen (Live Interview). 
        Standard TopAppBar and BottomNavBar are suppressed to prioritize the Canvas.
        A custom contextual header is used instead.
    -->
<header class="fixed top-0 left-0 w-full z-50 px-container-padding py-stack-gap-md bg-surface/40 backdrop-blur-xl shadow-2xl flex justify-between items-center border-b border-white/5">
<!-- Left: Status/Title -->
<div class="flex items-center gap-2 text-primary">
<span class="material-symbols-outlined text-[20px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">graphic_eq</span>
<span class="font-label-caps text-label-caps uppercase tracking-widest text-primary/90">AI INTERVIEW</span>
</div>
<!-- Center: Progress -->
<div class="text-on-surface-variant font-body-sm text-body-sm hidden md:block">
            Question <span class="text-on-surface font-bold">3</span> of 10
        </div>
<!-- Right: Timer -->
<div class="flex items-center gap-2 text-error font-title-md text-title-md tabular-nums animate-pulse drop-shadow-[0_0_8px_rgba(255,180,171,0.5)]">
<span class="material-symbols-outlined">timer</span>
            12:42
        </div>
</header>
<!-- Main Canvas -->
<main class="flex-1 flex flex-col pt-[90px] pb-safe-area-bottom px-container-padding max-w-3xl mx-auto w-full gap-stack-gap-lg">
<!-- Mobile Progress Indicator (Visible only on small screens) -->
<div class="md:hidden text-center text-on-surface-variant font-body-sm text-body-sm mb-[-8px]">
            Question <span class="text-on-surface font-bold">3</span> of 10
        </div>
<!-- AI Interviewer Card (The "Orb" & Question) -->
<section class="flex flex-col items-center justify-center p-6 md:p-10 bg-white/[0.03] backdrop-blur-2xl border border-white/10 rounded-[32px] shadow-[0_8px_32px_0_rgba(0,0,0,0.5)] relative overflow-hidden flex-1 min-h-[350px]">
<!-- Subtle background mesh/grid inside card -->
<div class="absolute inset-0 bg-[linear-gradient(to_right,rgba(255,255,255,0.02)_1px,transparent_1px),linear-gradient(to_bottom,rgba(255,255,255,0.02)_1px,transparent_1px)] bg-[size:24px_24px] pointer-events-none"></div>
<!-- The AI Avatar/Orb -->
<div class="relative w-32 h-32 mb-10 flex items-center justify-center group">
<!-- Outer atmospheric glows -->
<div class="absolute inset-[-20%] bg-primary/20 rounded-full blur-[30px] animate-[pulse_4s_ease-in-out_infinite]"></div>
<div class="absolute inset-0 bg-secondary/30 rounded-full blur-[15px] animate-[ping_3s_cubic-bezier(0,0,0.2,1)_infinite]"></div>
<!-- Core orb -->
<div class="relative z-10 w-24 h-24 bg-gradient-to-br from-primary to-inverse-primary rounded-full shadow-[0_0_40px_rgba(173,198,255,0.8)] flex items-center justify-center overflow-hidden border border-white/30 backdrop-blur-md">
<div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
<span class="material-symbols-outlined text-white text-[40px] drop-shadow-md z-20" data-weight="fill" style="font-variation-settings: 'FILL' 1;">record_voice_over</span>
</div>
</div>
<!-- CSS Waveform Animation -->
<div class="flex items-center justify-center gap-[3px] mb-8 h-10 w-full relative z-10">
<div class="w-1 bg-primary/80 rounded-full h-[40%] bar-1 shadow-[0_0_8px_rgba(173,198,255,0.6)]"></div>
<div class="w-1 bg-primary/90 rounded-full h-[70%] bar-2 shadow-[0_0_8px_rgba(173,198,255,0.6)]"></div>
<div class="w-1 bg-white rounded-full h-[100%] bar-3 shadow-[0_0_12px_rgba(255,255,255,0.8)]"></div>
<div class="w-1 bg-primary/90 rounded-full h-[80%] bar-4 shadow-[0_0_8px_rgba(173,198,255,0.6)]"></div>
<div class="w-1 bg-primary/80 rounded-full h-[50%] bar-5 shadow-[0_0_8px_rgba(173,198,255,0.6)]"></div>
</div>
<!-- Question Typography -->
<h1 class="text-center font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface z-10 relative max-w-xl mx-auto leading-tight">
                "Tell me about a machine learning project you worked on and the challenges you faced."
            </h1>
</section>
<!-- User Input & Actions Area -->
<section class="flex flex-col gap-stack-gap-md w-full shrink-0 relative z-20 mb-8 md:mb-0">
<!-- Transcription / Answer Area -->
<div class="relative w-full group">
<textarea class="w-full h-32 md:h-40 bg-surface-container-low/50 backdrop-blur-xl border border-white/10 rounded-2xl p-5 font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/50 transition-all resize-none shadow-[inset_0_2px_10px_rgba(0,0,0,0.5)]" placeholder="Listening to your answer..."></textarea>
<!-- Live Recording Indicator -->
<div class="absolute bottom-5 right-5 flex items-center gap-2 bg-background/80 px-3 py-1.5 rounded-full border border-white/5 backdrop-blur-md">
<div class="w-2.5 h-2.5 rounded-full bg-error animate-pulse shadow-[0_0_8px_rgba(255,180,171,0.8)]"></div>
<span class="text-on-surface font-body-sm text-body-sm">Recording</span>
</div>
</div>
<!-- Control Actions -->
<div class="flex justify-between items-center gap-4">
<!-- Secondary Action: Stop -->
<button class="flex-1 flex items-center justify-center gap-2 py-4 px-6 rounded-2xl border border-white/10 bg-white/5 text-on-surface font-title-md text-title-md hover:bg-white/10 transition-all active:scale-95 backdrop-blur-md">
<span class="material-symbols-outlined text-error" data-weight="fill" style="font-variation-settings: 'FILL' 1;">stop_circle</span>
                    Stop
                </button>
<!-- Primary Action: Submit -->
<button class="flex-[2] flex items-center justify-center gap-2 py-4 px-6 rounded-2xl bg-primary text-on-primary-fixed font-title-md text-title-md shadow-[0_0_20px_rgba(173,198,255,0.25)] hover:shadow-[0_0_30px_rgba(173,198,255,0.4)] hover:scale-[1.02] active:scale-95 transition-all">
                    Submit Answer
                    <span class="material-symbols-outlined text-[20px]">send</span>
</button>
</div>
</section>
</main>
</body></html>
