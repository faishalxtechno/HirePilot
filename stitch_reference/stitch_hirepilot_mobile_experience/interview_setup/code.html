<style>
        body {
            background-color: #020617; /* Deep Navy Background */
            color: #e1e2ec;
        }
        .light-leak {
            position: fixed;
            top: -20vh;
            left: -20vw;
            width: 70vw;
            height: 70vh;
            background: radial-gradient(circle, rgba(173,198,255,0.1) 0%, rgba(10,13,26,0) 70%);
            z-index: 0;
            pointer-events: none;
        }
        .light-leak-2 {
            position: fixed;
            bottom: -20vh;

            z-index: 0;
            pointer-events: none;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .glass-input:focus-within {
            border-color: #adc6ff;
            box-shadow: 0 0 12px rgba(173, 198, 255, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #adc6ff;
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(173, 198, 255, 0.5);
        }
        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: #adc6ff;
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(173, 198, 255, 0.5);
        }

<body class="antialiased min-h-screen relative overflow-x-hidden selection:bg-primary selection:text-on-primary">
<!-- Atmospheric Lighting -->
<div class="light-leak"></div>
<div class="light-leak-2"></div>
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-padding py-stack-gap-sm bg-surface/30 dark:bg-surface/30 backdrop-blur-xl border-b border-white/10 shadow-2xl">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container-high overflow-hidden border border-white/10">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="A futuristic UI avatar placeholder, stylized 3D portrait, soft cinematic lighting, deep navy and electric blue tones, high-end professional aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDYXvmY3SvX8NEf7jrhdp5zRxI_K6KXjbPCTcMP6wMqbv5ViN2oDD5PGw8h6TADhgnHDIEytzPkWFHBmE32eNQziYU5Nf2BHIxcPIvCbMXuiZkd1yi4qeLLMxkC99gXkDCmjnmx68OBkKIhoTQQ_WMhodqeNJn0N0mLHffZ82FvTlgqCIsU5NQKz6p7PaHv-aQch4j83wUlJFYFkPVWyWcR7kn78JlVYSe10Ho02DQ8pFxA5KmlmI8g"/>
</div>
</div>
<h1 class="font-display-lg text-display-lg font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary">HirePilot</h1>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/5 transition-colors text-on-surface-variant hover:text-primary active:scale-95 duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="relative z-10 pt-28 pb-safe-area-bottom px-container-padding min-h-screen flex flex-col items-center md:pt-32">
<div class="w-full max-w-md mx-auto space-y-stack-gap-lg">
<!-- Header -->
<div class="text-center space-y-stack-gap-sm">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface md:font-headline-lg md:text-headline-lg">Interview Setup</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Configure your AI copilot for the upcoming session.</p>
</div>
<!-- Configuration Form -->
<div class="glass-panel rounded-2xl p-stack-gap-lg space-y-stack-gap-md shadow-[0_8px_32px_0_rgba(0,0,0,0.5)]">
<!-- Job Role -->
<div class="space-y-unit">
<label class="font-label-caps text-label-caps text-primary">Job Role</label>
<div class="glass-input rounded-xl flex items-center px-4 py-3 group">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary mr-3 transition-colors">work</span>
<input class="w-full bg-transparent border-none outline-none font-body-lg text-body-lg text-on-surface placeholder-outline-variant p-0 focus:ring-0" placeholder="e.g. Frontend Developer" type="text" value="Machine Learning Engineer"/>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-gap-md">
<!-- Interview Type -->
<div class="space-y-unit">
<label class="font-label-caps text-label-caps text-primary">Interview Type</label>
<div class="glass-input rounded-xl relative px-4 py-3 group">
<select class="w-full bg-transparent border-none outline-none font-body-lg text-body-lg text-on-surface appearance-none focus:ring-0 p-0 pr-8 cursor-pointer relative z-10">
<option class="bg-surface text-on-surface" selected="" value="technical">Technical</option>
<option class="bg-surface text-on-surface" value="behavioral">Behavioral</option>
<option class="bg-surface text-on-surface" value="system_design">System Design</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline pointer-events-none group-focus-within:text-primary">expand_more</span>
</div>
</div>
<!-- Difficulty -->
<div class="space-y-unit">
<label class="font-label-caps text-label-caps text-primary">Difficulty</label>
<div class="glass-input rounded-xl relative px-4 py-3 group">
<select class="w-full bg-transparent border-none outline-none font-body-lg text-body-lg text-on-surface appearance-none focus:ring-0 p-0 pr-8 cursor-pointer relative z-10">
<option class="bg-surface text-on-surface" value="easy">Easy</option>
<option class="bg-surface text-on-surface" selected="" value="medium">Medium</option>
<option class="bg-surface text-on-surface" value="hard">Hard</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline pointer-events-none group-focus-within:text-primary">expand_more</span>
</div>
</div>
</div>
<!-- Separation Line -->
<div class="h-px w-full bg-white/10 my-stack-gap-sm"></div>
<!-- Experience Level -->
<div class="space-y-stack-gap-sm">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-primary">Experience Level</label>
<span class="font-body-sm text-body-sm text-secondary" id="exp-val">Mid-Level</span>
</div>
<div class="px-2">
<input class="w-full h-1 bg-surface-container-high rounded-full appearance-none outline-none" id="exp-slider" max="3" min="1" type="range" value="2"/>
<div class="flex justify-between mt-2 font-label-caps text-label-caps text-outline-variant text-[10px]">
<span>Junior</span>
<span>Mid</span>
<span>Senior</span>
</div>
</div>
</div>
<!-- Duration -->
<div class="space-y-unit">
<label class="font-label-caps text-label-caps text-primary">Duration</label>
<div class="glass-input rounded-xl flex items-center px-4 py-3 group">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary mr-3 transition-colors">schedule</span>
<input class="w-20 bg-transparent border-none outline-none font-body-lg text-body-lg text-on-surface placeholder-outline-variant p-0 focus:ring-0 text-center" type="number" value="30"/>
<span class="font-body-lg text-body-lg text-on-surface-variant ml-2">minutes</span>
</div>
</div>
</div>
<!-- CTA -->
<button class="w-full py-4 rounded-xl bg-primary text-on-primary font-title-md text-title-md hover:bg-primary-container transition-all active:scale-95 shadow-[0_0_20px_rgba(173,198,255,0.4)] hover:shadow-[0_0_30px_rgba(173,198,255,0.6)] flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                Start Interview
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 px-container-padding pb-safe-area-bottom flex justify-around items-center bg-surface-container/20 dark:bg-surface-container/20 backdrop-blur-2xl border-t border-white/10 md:hidden h-20 shadow-[0_8px_32px_0_rgba(0,0,0,0.5)]">
<!-- Home (Inactive) -->
<a class="flex flex-col items-center justify-center text-outline hover:text-primary/80" href="#">
<span class="material-symbols-outlined mb-1">home</span>
<span class="font-label-caps text-label-caps">Home</span>
</a>
<!-- Interview (Active) -->
<a class="flex flex-col items-center justify-center text-primary filter drop-shadow-[0_0_8px_rgba(173,198,255,0.8)] active:scale-110 duration-200 ease-out" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">mic_none</span>
<span class="font-label-caps text-label-caps">Interview</span>
</a>
<!-- Resume (Inactive) -->
<a class="flex flex-col items-center justify-center text-outline hover:text-primary/80" href="#">
<span class="material-symbols-outlined mb-1">description</span>
<span class="font-label-caps text-label-caps">Resume</span>
</a>
<!-- Jobs (Inactive) -->
<a class="flex flex-col items-center justify-center text-outline hover:text-primary/80" href="#">
<span class="material-symbols-outlined mb-1">work_outline</span>
<span class="font-label-caps text-label-caps">Jobs</span>
</a>
<!-- Profile (Inactive) -->
<a class="flex flex-col items-center justify-center text-outline hover:text-primary/80" href="#">
<span class="material-symbols-outlined mb-1">person_outline</span>
<span class="font-label-caps text-label-caps">Profile</span>
</a>
</nav>
<script>
        const slider = document.getElementById('exp-slider');
        const val = document.getElementById('exp-val');
        const labels = {
            '1': 'Entry-Level',
            '2': 'Mid-Level',
            '3': 'Senior-Level'
        };

        slider.addEventListener('input', (e) => {
            val.textContent = labels[e.target.value];
        });
    </script>
</body></html>
