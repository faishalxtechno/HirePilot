<style>
        .glow-text {
            text-shadow: 0 0 20px rgba(173, 198, 255, 0.4);
        }
        
        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(0.9);
                opacity: 0.5;
            }
            70% {
                transform: scale(1.1);
                opacity: 0;
            }
            100% {
                transform: scale(0.9);
                opacity: 0;
            }
        }

        .ambient-glow {
            position: absolute;
            width: 150vw;
            height: 150vh;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(77, 142, 255, 0.08) 0%, rgba(16, 19, 26, 0) 70%);
            pointer-events: none;
            z-index: 0;
        }
    </style>

<body class="bg-background text-on-background h-screen w-screen overflow-hidden flex flex-col items-center justify-center relative">
<!-- Ambient Atmospheric Glow -->
<div class="ambient-glow"></div>
<!-- Main Content Container -->
<div class="relative z-10 flex flex-col items-center justify-center space-y-stack-gap-lg">
<!-- Logo Icon with Pulse -->
<div class="relative flex items-center justify-center">
<!-- Pulsing Rings -->
<div class="absolute inset-0 rounded-full border border-primary/30 pulse-ring w-24 h-24 sm:w-32 sm:h-32 m-auto"></div>
<div class="absolute inset-0 rounded-full border border-primary/20 pulse-ring w-32 h-32 sm:w-40 sm:h-40 m-auto" style="animation-delay: 0.5s;"></div>
<!-- Glass Icon Container -->
<div class="w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-white/5 backdrop-blur-xl border border-white/10 flex items-center justify-center shadow-[0_8px_32px_0_rgba(0,0,0,0.5)] z-20">
<span class="material-symbols-outlined text-primary text-4xl sm:text-5xl" style="font-variation-settings: 'FILL' 1;">
                    rocket_launch
                </span>
</div>
</div>
<!-- Typography -->
<div class="text-center space-y-stack-gap-sm">
<h1 class="font-display-lg text-display-lg bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary glow-text">
                HirePilot
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant opacity-80 uppercase tracking-widest text-sm">
                Your AI Career Copilot
            </p>
</div>
<!-- Loading Indicator -->
<div class="mt-12 flex space-x-2 items-center justify-center">
<div class="w-2 h-2 rounded-full bg-primary/50 animate-bounce" style="animation-delay: 0s;"></div>
<div class="w-2 h-2 rounded-full bg-primary/50 animate-bounce" style="animation-delay: 0.2s;"></div>
<div class="w-2 h-2 rounded-full bg-primary/50 animate-bounce" style="animation-delay: 0.4s;"></div>
</div>
