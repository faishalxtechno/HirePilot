<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HirePilot - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {

                extend: {

                        "surface-bright": "#363941",

                        "inverse-primary": "#005ac2",
                        "background": "#10131a",
                        "surface-container-high": "#272a31",

                        "outline": "#8c909f",
                        "on-background": "#e1e2ec",
                        "surface-dim": "#10131a",
                        "secondary": "#4cd7f6",
                        "secondary-container": "#03b5d3",
                        "tertiary-fixed-dim": "#ffb786",

                        "primary-fixed-dim": "#adc6ff",

                        "error": "#ffb4ab",

                        "on-primary": "#002e6a",
                        "secondary-fixed-dim": "#4cd7f6",
                        "inverse-on-surface": "#2e3038",
                        "surface-container": "#1d2027",

                        "stack-gap-sm": "8px",

                        "container-padding": "20px"

                        "label-caps": ["Inter"],

                    "fontSize": {

<style>
        .light-leak {
            background: radial-gradient(circle at top right, rgba(77, 142, 255, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at bottom left, rgba(76, 215, 246, 0.05) 0%, transparent 50%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            border-color: #adc6ff;
            box-shadow: 0 0 15px rgba(173, 198, 255, 0.3);
            outline: none;
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen font-body-lg text-body-lg flex flex-col items-center justify-center relative overflow-hidden">
<!-- Atmospheric Light Leaks -->
<div class="absolute inset-0 light-leak pointer-events-none z-0"></div>
<main class="w-full max-w-md px-container-padding z-10 flex flex-col items-center">
<!-- Logo & Header -->
<div class="mb-10 text-center w-full flex flex-col items-center">
<div class="w-16 h-16 rounded-2xl glass-card flex items-center justify-center mb-6 shadow-2xl">
<span class="material-symbols-outlined text-4xl text-primary" style="font-variation-settings: 'FILL' 1;">
                    flight_takeoff
                </span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-2">Welcome back</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Continue your career journey.</p>
</div>
<!-- Login Form -->
<form class="w-full space-y-stack-gap-md mb-stack-gap-lg">
<div class="space-y-stack-gap-sm">
<label class="block font-label-caps text-label-caps text-on-surface-variant ml-1" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">
                        mail
                    </span>
<input class="glass-input w-full rounded-xl py-3 pl-10 pr-4 text-on-surface placeholder:text-outline bg-transparent" id="email" placeholder="Enter your email" required="" type="email"/>
</div>
</div>
<div class="space-y-stack-gap-sm">
<div class="flex justify-between items-center ml-1 mr-1">
<label class="block font-label-caps text-label-caps text-on-surface-variant" for="password">Password</label>
<a class="font-body-sm text-body-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">
                        lock
                    </span>
<input class="glass-input w-full rounded-xl py-3 pl-10 pr-4 text-on-surface placeholder:text-outline bg-transparent" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<button class="w-full bg-primary-container text-on-primary-container py-3 rounded-xl font-title-md text-title-md hover:bg-primary transition-colors shadow-[0_0_20px_rgba(77,142,255,0.4)] mt-stack-gap-lg" type="submit">
                Log in
            </button>
</form>
<!-- Divider -->
<div class="w-full flex items-center justify-between mb-stack-gap-lg">
<div class="h-px bg-white/10 flex-1"></div>
<span class="px-4 font-label-caps text-label-caps text-outline">OR</span>
<div class="h-px bg-white/10 flex-1"></div>
</div>
<!-- Google Auth -->
<button class="w-full glass-card py-3 rounded-xl font-title-md text-title-md text-on-surface hover:bg-white/10 transition-colors flex items-center justify-center gap-3">
<img alt="Google Logo" class="w-6 h-6 rounded-full" data-alt="A clean, minimalist 24x24 pixel Google G logo on a dark background, matching the dark liquid glass aesthetic of a futuristic AI application. The logo is flat and sharp, illuminated by soft white light." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCdSP9tdBOnohHt8Eb8Njl6BRGsyo4njOGBCMSrczlJRYEcJDwVJB2NkNZdSqYaZ4bcQ4Dq49EOVcY9asagHRiS__vmZhco55uXlMPi90_voBV1wIuaJfMLAloahiUiptLFVBL1kWN1pskpPtxx8V6Pw4fWi8TGRT7Lk99uhoEkuvPmO1AWBhZ1uEwSn8Ee4WysDCEADxH9ZfgUtamNMpPZBy0mVH0eWPhQ1eqyhPEV-E3wdnS942qW"/>
            Continue with Google
        </button>
<!-- Footer -->
<p class="mt-10 font-body-sm text-body-sm text-on-surface-variant">
            Don't have an account? <a class="text-primary hover:text-primary-container transition-colors font-semibold" href="#">Create account</a>
</p>
</main>
</body></html>
